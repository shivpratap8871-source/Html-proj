<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Card</title>

    <style>
        body{
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .card{
            width: 350px;
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }

        .card img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .card h1{
            margin: 10px 0;
            color: #333;
        }

        .card p{
            color: #666;
            margin: 5px;
        }

        .btn{
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover{
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://via.placeholder.com/100" alt="Profile">

        <h1>Shiv Pratap Rawat</h1>

        <p>Web Developer</p>

        <p>Email: shivpratap8871@gmail.com</p>

        <p>Phone: +91 9876543210</p>

        <p>Bangalore, India</p>

        <a href="#" class="btn">Contact Me</a>

    </div>

</body>
</html>
